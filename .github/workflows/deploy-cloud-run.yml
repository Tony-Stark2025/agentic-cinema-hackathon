name: Deploy Showrunner to Google Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: showrunner-studio-ops
  REGION: us-central1

jobs:
  deploy:
    name: Build & Deploy to Google Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        if: "${{ env.PROJECT_ID != '' }}"
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: "${{ env.PROJECT_ID != '' }}"
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker to Artifact Registry / GCR
        if: "${{ env.PROJECT_ID != '' }}"
        run: gcloud auth configure-docker --quiet

      - name: Build and Push Docker Image
        if: "${{ env.PROJECT_ID != '' }}"
        run: |
          docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }} .
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        if: "${{ env.PROJECT_ID != '' }}"
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --set-env-vars GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 5
